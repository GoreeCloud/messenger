# Explicit opt-in, source-built local development. Not a production deployment.
name: goreecloud-messenger-source-preview
services:
  synapse:
    # Build this image ONLY through the audited, explicitly acknowledged
    # deploy/build_source.sh entrypoint; Compose must never invoke the
    # upstream Dockerfile directly, as it has known supply-chain risks.
    image: goreecloud-messenger/synapse:1.163.0-source-local
    pull_policy: never
    restart: "no"
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    ports:
      - "127.0.0.1:8008:8008"
    volumes:
      - ./data/synapse:/data
    security_opt:
      - no-new-privileges:true
