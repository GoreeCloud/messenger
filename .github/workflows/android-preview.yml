name: Android native preview checks
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-preview.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-preview.yml"
permissions:
  contents: read
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Compile native preview and run JVM tests
        working-directory: android
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
