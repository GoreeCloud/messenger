name: Android native preview checks
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "web/foundations/**"
      - ".github/workflows/android-preview.yml"
  pull_request:
    paths:
      - "android/**"
      - "web/foundations/**"
      - ".github/workflows/android-preview.yml"
permissions:
  contents: read
jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: "8.13"
      - name: Install Android SDK 36 using runner command-line tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --version
          yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;35.0.0"
      - name: Validate native GC UI palette against pinned Foundations CSS
        run: python3 android/scripts/check-gc-ui-token-mapping.py
      - name: Compile native preview, run JVM tests and Android lint
        working-directory: android
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace
      - name: Upload debug APK for device validation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: goreecloud-messenger-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
