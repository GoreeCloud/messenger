name: Messenger foundation checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --console=plain
        working-directory: android
