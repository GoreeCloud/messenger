name: Messenger foundation checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: goreecloud-messenger-web-preview
          path: web/dist/
          retention-days: 7
          if-no-files-found: error
  android:
    name: android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: goreecloud-messenger-android-debug-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
  backend:
    name: backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s deploy/tests -v
      - run: python3 deploy/verify_source.py
      - run: bash deploy/build_source.sh
