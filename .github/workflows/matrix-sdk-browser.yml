name: Matrix Rust IndexedDB browser probe
on:
  push:
    branches: [main]
    paths:
      - "integration/matrix-sdk-browser/**"
      - "src/secure-data.mjs"
      - "src/crypto-store-lease.mjs"
      - "src/matrix.mjs"
      - ".github/workflows/matrix-sdk-browser.yml"
  pull_request:
    paths:
      - "integration/matrix-sdk-browser/**"
      - "src/secure-data.mjs"
      - "src/crypto-store-lease.mjs"
      - "src/matrix.mjs"
      - ".github/workflows/matrix-sdk-browser.yml"
permissions:
  contents: read
jobs:
  matrix-rust-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integration/matrix-sdk-browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install SDK and bundler without lifecycle scripts
        run: npm ci --ignore-scripts --no-fund
      - name: Audit test dependency graph for high and critical findings
        run: npm audit --audit-level=high
      - name: Build test-only browser SDK/WASM assets
        run: npm run build
      - name: Test guarded Rust IndexedDB identity, lock, persistence and reopen in Chromium
        run: npm run smoke
      - name: Preserve dependency lockfile for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: matrix-rust-browser-probe-lock
          path: integration/matrix-sdk-browser/package-lock.json
          retention-days: 7
          if-no-files-found: ignore
