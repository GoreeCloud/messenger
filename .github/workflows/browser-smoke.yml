name: Browser interaction smoke
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "scripts/browser-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - "scripts/browser-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Verify browser availability
        run: command -v google-chrome || command -v chromium
      - name: Exercise actual browser UI
        run: node scripts/browser-smoke.mjs
      - name: Attach synthetic test screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: messenger-browser-smoke
          path: artifacts/browser/
          retention-days: 7
          if-no-files-found: ignore
